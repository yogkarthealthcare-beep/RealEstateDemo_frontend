<section id="earn" class="sec-py earn-section">
  <div class="mmr-container">
    <div class="row g-4 g-lg-5 align-items-center">
      <div class="col-lg-5">
        <div class="sec-label">Associate Program</div>
        <h2 class="sec-title">Earn <span>Commission</span><br/>For 12 Years</h2>
        <div class="sec-line"></div>
        <p class="sec-desc mb-4 mb-md-5">Plot बेचें, commission पाएं — और वो भी 12 साल तक हर महीने।</p>
        <div class="timeline">
          <div class="tl-item" *ngFor="let t of timeline">
            <div class="tl-dot"></div>
            <div class="tl-box">
              <div class="tl-label">{{ t.label }}</div>
              <div class="tl-value">{{ t.value }}</div>
              <div class="tl-desc">{{ t.desc }}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="earn-card-box">
          <h4 class="earn-card-title">How It Works</h4>
          <div class="earn-steps-list">
            <div class="earn-step-item" *ngFor="let s of steps">
              <div class="earn-step-num" [class.step-gold]="s.gold">{{ s.num }}</div>
              <div>
                <h6 class="earn-step-heading">{{ s.title }}</h6>
                <p class="earn-step-desc">{{ s.desc }}</p>
              </div>
            </div>
          </div>
          <div class="mt-4">
            <a routerLink="/register" [queryParams]="{type: 'Associate'}" class="btn btn-green btn-lg w-100">
              <i class="fas fa-user-tie me-2"></i>Become an Associate — Free
            </a>
            <div class="earn-disclaimer-text">*Earnings depend on performance. Terms &amp; conditions apply.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
