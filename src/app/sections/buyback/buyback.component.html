<section id="buyback" class="sec-py buyback-section">
  <div class="mmr-container" style="position:relative;z-index:1;">
    <div class="text-center mb-4 mb-md-5">
      <div class="sec-label" style="justify-content:center;color:var(--clr-gold-lt);">A Decade of Excellence</div>
      <h2 class="sec-title" style="color:#fff;">Unmatched <span style="color:var(--clr-gold-lt);">Trust &amp; Reliability</span></h2>
      <p style="color:rgba(255,255,255,.7);max-width:540px;margin:0 auto;font-size:14px;">10+ वर्षों का अटूट विश्वास, निष्पक्ष पारदर्शिता और सैकड़ों संतुष्ट परिवारों का सपना साकार करने का संकल्प।</p>
    </div>
    <div class="row g-2.5 g-md-4">
      <div class="col-6 col-lg-3 d-flex" *ngFor="let card of cards">
        <div class="bb-card w-100 h-100">
          <div class="bb-icon"><i [class]="card.icon"></i></div>
          <h5>{{ card.title }}</h5>
          <p>{{ card.desc }}</p>
        </div>
      </div>
    </div>
    <div class="text-center mt-4 mt-md-5">
      <button class="btn btn-gold btn-lg" (click)="scrollTo('contact')"><i class="fas fa-handshake me-2"></i>Contact Our Experts</button>
    </div>
  </div>
</section>
