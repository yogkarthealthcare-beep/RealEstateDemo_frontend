<div id="topbar" class="topbar-wrapper" *ngIf="settings$ | async as settings">
  <div class="mmr-container topbar-inner">
    <!-- Left: Contact Info -->
    <div class="topbar-left">
      <a *ngIf="settings.company_phone" [href]="'tel:' + settings.company_phone" class="topbar-link">
        <i class="fas fa-phone-alt"></i> <span>{{ settings.company_phone }}</span>
      </a>
      <a *ngIf="settings.company_email" [href]="'mailto:' + settings.company_email" class="topbar-link d-none d-lg-flex">
        <i class="fas fa-envelope"></i> <span>{{ settings.company_email }}</span>
      </a>
    </div>

    <!-- Right: CIN & GSTIN (Single Line) + Language Selector -->
    <div class="topbar-right">
      <div class="reg-tags d-none d-sm-flex" *ngIf="settings.cin_number || settings.gst_number">
        <span class="reg-badge" *ngIf="settings.cin_number">CIN: {{ settings.cin_number }}</span>
        <span class="reg-sep" *ngIf="settings.cin_number && settings.gst_number">|</span>
        <span class="reg-badge" *ngIf="settings.gst_number">GSTIN: {{ settings.gst_number }}</span>
      </div>

      <div class="lang-picker">
        <i class="fas fa-globe"></i>
        <select 
          [value]="languageService.current()" 
          (change)="onLanguageChange($event)" 
          aria-label="Select Language"
          class="lang-select">
          <option value="hinglish">Hinglish</option>
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
        </select>
      </div>
    </div>
  </div>
</div>
